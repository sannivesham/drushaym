<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>సన్నివేశం స్ట్రీమ్</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;
      --bg2:#111118;
      --bg3:#1a1a24;
      --card:#16161f;
      --gold:#f5a623;
      --gold2:#e8942a;
      --red:#e50914;
      --text:#ffffff;
      --text2:#b3b3b3;
      --text3:#808080;
      --border:rgba(255,255,255,0.08);
    }
    html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    img{display:block}

    /* NAVBAR */
    .navbar{
      position:fixed;top:0;left:0;right:0;z-index:1000;
      padding:0 40px;height:68px;
      display:flex;align-items:center;justify-content:space-between;
      background:linear-gradient(to bottom,rgba(10,10,15,0.95),transparent);
      transition:background 0.3s;
    }
    .navbar.scrolled{background:rgba(10,10,15,0.98);backdrop-filter:blur(12px);}
    .nav-logo{
      font-size:1.5rem;font-weight:800;
      background:linear-gradient(135deg,#f5a623,#e8942a);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-0.5px;
    }
    .nav-links{display:flex;gap:24px;align-items:center;}
    .nav-links a{font-size:0.88rem;color:var(--text2);font-weight:500;transition:color 0.2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--text);}
    .nav-right{display:flex;align-items:center;gap:16px;}
    .nav-search-btn{background:none;border:none;color:var(--text2);font-size:1.1rem;cursor:pointer;padding:6px;}
    .nav-search-btn:hover{color:var(--text);}
    .nav-profile-btn{
      width:36px;height:36px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:0.85rem;font-weight:700;color:#000;
    }
    .nav-signin-btn{
      padding:8px 20px;border-radius:6px;
      background:var(--gold);color:#000;
      font-size:0.85rem;font-weight:700;border:none;cursor:pointer;
      transition:background 0.2s;
    }
    .nav-signin-btn:hover{background:var(--gold2);}

    /* HERO */
    .hero{
      position:relative;height:100vh;min-height:600px;
      display:flex;align-items:flex-end;
      padding-bottom:80px;overflow:hidden;
    }
    .hero-bg{
      position:absolute;inset:0;
      background:linear-gradient(to right,rgba(10,10,15,0.95) 40%,transparent),
                linear-gradient(to top,rgba(10,10,15,1) 0%,transparent 50%);
      z-index:1;
    }
    .hero-thumb{
      position:absolute;inset:0;
      object-fit:cover;width:100%;height:100%;opacity:0.5;
    }
    .hero-content{
      position:relative;z-index:2;
      padding:0 40px 0 60px;
      max-width:620px;
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 12px;border-radius:4px;
      background:rgba(245,166,35,0.15);border:1px solid rgba(245,166,35,0.3);
      color:var(--gold);font-size:0.72rem;font-weight:700;
      letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;
    }
    .hero-title{
      font-size:3rem;font-weight:800;line-height:1.1;
      margin-bottom:16px;letter-spacing:-1px;
    }
    .hero-desc{
      font-size:0.95rem;color:var(--text2);line-height:1.7;
      margin-bottom:28px;max-width:480px;
    }
    .hero-meta{
      display:flex;align-items:center;gap:16px;
      margin-bottom:24px;
    }
    .hero-meta-item{font-size:0.82rem;color:var(--text2);}
    .hero-meta-dot{width:4px;height:4px;border-radius:50%;background:var(--text3);}
    .hero-free-badge{
      padding:3px 10px;border-radius:4px;
      background:rgba(46,213,115,0.15);border:1px solid rgba(46,213,115,0.3);
      color:#2ed573;font-size:0.72rem;font-weight:700;
    }
    .hero-paid-badge{
      padding:3px 10px;border-radius:4px;
      background:rgba(245,166,35,0.15);border:1px solid rgba(245,166,35,0.3);
      color:var(--gold);font-size:0.72rem;font-weight:700;
    }
    .hero-btns{display:flex;gap:12px;flex-wrap:wrap;}
    .btn-watch{
      padding:13px 30px;border-radius:6px;
      background:var(--text);color:#000;
      font-size:0.95rem;font-weight:700;border:none;cursor:pointer;
      display:flex;align-items:center;gap:8px;
      transition:background 0.2s;
    }
    .btn-watch:hover{background:#e0e0e0;}
    .btn-more{
      padding:13px 28px;border-radius:6px;
      background:rgba(255,255,255,0.12);color:var(--text);
      font-size:0.95rem;font-weight:600;border:none;cursor:pointer;
      backdrop-filter:blur(8px);
      transition:background 0.2s;
    }
    .btn-more:hover{background:rgba(255,255,255,0.18);}

    /* CATEGORY ROWS */
    .content-section{padding:0 40px 60px;}

    .row-header{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:20px;
    }
    .row-title{font-size:1.15rem;font-weight:700;letter-spacing:-0.3px;}
    .row-see-all{
      font-size:0.8rem;color:var(--gold);font-weight:600;
      cursor:pointer;display:flex;align-items:center;gap:4px;
    }
    .row-see-all:hover{color:var(--gold2);}

    .video-row{
      display:flex;gap:12px;overflow-x:auto;
      padding-bottom:12px;scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .video-row::-webkit-scrollbar{display:none;}

    .video-card{
      flex:0 0 220px;border-radius:10px;overflow:hidden;
      background:var(--card);cursor:pointer;
      transition:transform 0.25s,box-shadow 0.25s;
      scroll-snap-align:start;position:relative;
    }
    .video-card:hover{transform:scale(1.05);z-index:2;box-shadow:0 20px 40px rgba(0,0,0,0.6);}
    .video-card-thumb{
      width:100%;aspect-ratio:16/9;
      object-fit:cover;transition:0.3s;
    }
    .video-card:hover .video-card-thumb{opacity:0.7;}
    .video-card-overlay{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:0.25s;
    }
    .video-card:hover .video-card-overlay{opacity:1;}
    .play-circle{
      width:48px;height:48px;border-radius:50%;
      background:rgba(255,255,255,0.9);
      display:flex;align-items:center;justify-content:center;
      font-size:1.2rem;color:#000;
    }
    .video-card-body{padding:12px;}
    .video-card-title{font-size:0.88rem;font-weight:600;margin-bottom:4px;line-height:1.4;}
    .video-card-meta{font-size:0.75rem;color:var(--text3);display:flex;gap:8px;align-items:center;}
    .badge-free{
      padding:2px 7px;border-radius:3px;font-size:0.65rem;font-weight:700;
      background:rgba(46,213,115,0.15);color:#2ed573;border:1px solid rgba(46,213,115,0.2);
    }
    .badge-paid{
      padding:2px 7px;border-radius:3px;font-size:0.65rem;font-weight:700;
      background:rgba(245,166,35,0.15);color:var(--gold);border:1px solid rgba(245,166,35,0.2);
    }
    .badge-lock{font-size:0.7rem;color:var(--text3);}

    /* SUBSCRIBE BANNER */
    .sub-banner{
      margin:0 40px 60px;border-radius:16px;
      background:linear-gradient(135deg,#1a0a00,#2a1500);
      border:1px solid rgba(245,166,35,0.2);
      padding:40px 48px;
      display:flex;align-items:center;justify-content:space-between;gap:24px;
      flex-wrap:wrap;
    }
    .sub-banner-left h2{
      font-size:1.6rem;font-weight:800;margin-bottom:8px;
    }
    .sub-banner-left h2 span{color:var(--gold);}
    .sub-banner-left p{color:var(--text2);font-size:0.9rem;line-height:1.6;}
    .sub-banner-btn{
      padding:14px 36px;border-radius:8px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;font-size:1rem;font-weight:700;
      border:none;cursor:pointer;white-space:nowrap;
      transition:transform 0.2s;
    }
    .sub-banner-btn:hover{transform:translateY(-2px);}

    /* SEARCH OVERLAY */
    .search-overlay{
      position:fixed;inset:0;z-index:2000;
      background:rgba(10,10,15,0.97);backdrop-filter:blur(16px);
      display:none;flex-direction:column;align-items:center;
      padding:100px 40px 40px;
    }
    .search-overlay.show{display:flex;}
    .search-close{
      position:absolute;top:24px;right:32px;
      background:none;border:none;color:var(--text2);
      font-size:1.5rem;cursor:pointer;
    }
    .search-input-wrap{
      width:100%;max-width:640px;
      display:flex;align-items:center;gap:12px;
      border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:40px;
    }
    .search-icon{font-size:1.4rem;color:var(--gold);}
    .search-input{
      flex:1;background:none;border:none;outline:none;
      font-size:1.4rem;color:var(--text);font-family:'Inter',sans-serif;
    }
    .search-input::placeholder{color:var(--text3);}
    .search-results{width:100%;max-width:640px;}
    .search-result-card{
      display:flex;gap:14px;align-items:center;
      padding:14px 0;border-bottom:1px solid var(--border);
      cursor:pointer;
    }
    .search-result-card:hover{opacity:0.8;}
    .search-result-thumb{width:80px;height:45px;object-fit:cover;border-radius:6px;}
    .search-result-title{font-size:0.9rem;font-weight:600;}
    .search-result-cat{font-size:0.78rem;color:var(--text3);}

    /* FOOTER */
    footer{
      padding:48px 40px 32px;
      border-top:1px solid var(--border);
    }
    .footer-logo{
      font-size:1.2rem;font-weight:800;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      margin-bottom:24px;
    }
    .footer-links{
      display:flex;flex-wrap:wrap;gap:16px 32px;
      margin-bottom:24px;
    }
    .footer-links a{font-size:0.82rem;color:var(--text3);}
    .footer-links a:hover{color:var(--text);}
    .footer-copy{font-size:0.78rem;color:var(--text3);}

    /* RESPONSIVE */
    @media(max-width:768px){
      .navbar{padding:0 20px;}
      .nav-links{display:none;}
      .hero-content{padding:0 20px;max-width:100%;}
      .hero-title{font-size:2rem;}
      .content-section{padding:0 20px 40px;}
      .sub-banner{margin:0 20px 40px;padding:28px 24px;}
      .video-card{flex:0 0 160px;}
      .search-overlay{padding:80px 20px 20px;}
      footer{padding:32px 20px;}
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-logo">సన్నివేశం ▶</div>
    <div class="nav-links">
      <a href="index.html" class="active">హోమ్</a>
      <a href="browse.html">Browse</a>
      <a href="subscribe.html">Subscribe</a>
    </div>
    <div class="nav-right">
      <button class="nav-search-btn" id="searchBtn">🔍</button>
      <div id="navLoggedOut">
        <button class="nav-signin-btn" id="navSignInBtn">Sign In</button>
      </div>
      <div id="navLoggedIn" style="display:none;">
        <button class="nav-profile-btn" id="navProfileBtn">U</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero" id="heroSection">
    <div class="hero-bg"></div>
    <img class="hero-thumb" id="heroThumb" src="" alt="">
    <div class="hero-content">
      <div class="hero-badge">⭐ Featured</div>
      <h1 class="hero-title" id="heroTitle">లోడ్ అవుతోంది...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-meta">
        <span class="hero-meta-item" id="heroYear"></span>
        <div class="hero-meta-dot"></div>
        <span class="hero-meta-item" id="heroCat"></span>
        <div class="hero-meta-dot"></div>
        <span id="heroAccess"></span>
      </div>
      <div class="hero-btns">
        <button class="btn-watch" id="heroWatchBtn">▶ ఇప్పుడు చూడండి</button>
        <button class="btn-more" id="heroMoreBtn">ℹ More Info</button>
      </div>
    </div>
  </div>

  <!-- VIDEO ROWS -->
  <div class="content-section" id="videoRows"></div>

  <!-- SUBSCRIBE BANNER -->
  <div class="sub-banner" id="subBanner" style="display:none;">
    <div class="sub-banner-left">
      <h2>అన్ని వీడియోలు చూడండి <span>Unlimited</span> గా</h2>
      <p>పెయిడ్ కంటెంట్ అన్నీ చూడండి. నెలకు కేవలం ₹99 మాత్రమే.</p>
    </div>
    <button class="sub-banner-btn" onclick="window.location.href='subscribe.html'">Subscribe చేయండి</button>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">సన్నివేశం ▶</div>
    <div class="footer-links">
      <a href="#">మా గురించి</a>
      <a href="subscribe.html">Subscription</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
    <p class="footer-copy">© 2026 సన్నివేశం. All rights reserved.</p>
  </footer>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="searchOverlay">
    <button class="search-close" id="searchClose">✕</button>
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="వీడియో వెతకండి...">
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      collection, getDocs, doc, getDoc, query, orderBy, where
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import {
      GoogleAuthProvider, signInWithPopup, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    let currentUser = null;
    let isSubscribed = false;
    let allVideos = [];

    // Navbar scroll
    window.addEventListener("scroll", () => {
      document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 50);
    });

    // Auth
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("navLoggedOut").style.display = "none";
        document.getElementById("navLoggedIn").style.display = "block";
        const initial = (user.displayName || "U")[0].toUpperCase();
        document.getElementById("navProfileBtn").innerText = initial;
        // Check subscription
        try {
          const snap = await getDoc(doc(db, "subscribers", user.uid));
          isSubscribed = snap.exists() && snap.data().active;
        } catch(e) {}
        document.getElementById("subBanner").style.display = isSubscribed ? "none" : "flex";
      } else {
        document.getElementById("navLoggedOut").style.display = "block";
        document.getElementById("navLoggedIn").style.display = "none";
        document.getElementById("subBanner").style.display = "flex";
      }
    });

    document.getElementById("navSignInBtn").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch(e) {}
    });

    document.getElementById("navProfileBtn").addEventListener("click", () => {
      window.location.href = "profile.html";
    });

    // Load featured video
    async function loadHero() {
      try {
        const snap = await getDoc(doc(db, "streamSettings", "hero"));
        if (!snap.exists()) return;
        const heroId = snap.data().videoId;
        if (!heroId) return;
        const vSnap = await getDoc(doc(db, "streamVideos", heroId));
        if (!vSnap.exists()) return;
        const v = vSnap.data();
        document.getElementById("heroThumb").src = v.thumbnail || "";
        document.getElementById("heroTitle").innerText = v.title || "";
        document.getElementById("heroDesc").innerText = v.description || "";
        document.getElementById("heroYear").innerText = v.year || "";
        document.getElementById("heroCat").innerText = v.category || "";
        document.getElementById("heroAccess").innerHTML = v.access === "free"
          ? `<span class="hero-free-badge">FREE</span>`
          : `<span class="hero-paid-badge">⭐ PREMIUM</span>`;
        document.getElementById("heroWatchBtn").onclick = () => {
          window.location.href = `watch.html?id=${heroId}`;
        };
        document.getElementById("heroMoreBtn").onclick = () => {
          window.location.href = `watch.html?id=${heroId}`;
        };
      } catch(e) {}
    }

    // Load video rows by category
    async function loadRows() {
      const rowsEl = document.getElementById("videoRows");
      try {
        // Get categories
        const catSnap = await getDocs(query(
          collection(db, "streamCategories"), orderBy("order", "asc")
        ));
        const categories = [];
        catSnap.forEach(d => categories.push({ id: d.id, ...d.data() }));

        // Get all videos
        const vidSnap = await getDocs(collection(db, "streamVideos"));
        allVideos = [];
        vidSnap.forEach(d => allVideos.push({ id: d.id, ...d.data() }));

        rowsEl.innerHTML = "";

        for (const cat of categories) {
          const catVideos = allVideos.filter(v => v.categoryId === cat.id);
          if (catVideos.length === 0) continue;

          const row = document.createElement("div");
          row.style.marginBottom = "40px";
          row.innerHTML = `
            <div class="row-header">
              <div class="row-title">${cat.emoji || ""} ${cat.name}</div>
              <div class="row-see-all" onclick="window.location.href='browse.html?cat=${cat.id}'">అన్నీ చూడండి →</div>
            </div>
            <div class="video-row" id="row-${cat.id}"></div>
          `;
          rowsEl.appendChild(row);

          const rowEl = document.getElementById(`row-${cat.id}`);
          catVideos.forEach(v => {
            rowEl.innerHTML += buildCard(v);
          });

          // Click handlers
          rowEl.querySelectorAll(".video-card").forEach(card => {
            card.addEventListener("click", () => {
              window.location.href = `watch.html?id=${card.dataset.id}`;
            });
          });
        }
      } catch(e) {
        rowsEl.innerHTML = "<p style='color:var(--text3);text-align:center;padding:40px'>Videos load చేయడం విఫలమైంది</p>";
      }
    }

    function buildCard(v) {
      const badge = v.access === "free"
        ? `<span class="badge-free">FREE</span>`
        : `<span class="badge-paid">⭐ PREMIUM</span>`;
      return `
        <div class="video-card" data-id="${v.id}">
          <img class="video-card-thumb" src="${v.thumbnail || ""}" alt="${v.title}">
          <div class="video-card-overlay">
            <div class="play-circle">▶</div>
          </div>
          <div class="video-card-body">
            <div class="video-card-title">${v.title}</div>
            <div class="video-card-meta">${badge} <span>${v.duration || ""}</span></div>
          </div>
        </div>
      `;
    }

    // Search
    const searchBtn     = document.getElementById("searchBtn");
    const searchClose   = document.getElementById("searchClose");
    const searchOverlay = document.getElementById("searchOverlay");
    const searchInput   = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    searchBtn.addEventListener("click", () => {
      searchOverlay.classList.add("show");
      searchInput.focus();
    });
    searchClose.addEventListener("click", () => searchOverlay.classList.remove("show"));

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      searchResults.innerHTML = "";
      if (!q) return;
      const filtered = allVideos.filter(v =>
        (v.title || "").toLowerCase().includes(q) ||
        (v.description || "").toLowerCase().includes(q)
      );
      if (filtered.length === 0) {
        searchResults.innerHTML = `<p style="color:var(--text3)">వీడియోలు కనుగొనబడలేదు</p>`;
        return;
      }
      filtered.slice(0, 8).forEach(v => {
        searchResults.innerHTML += `
          <div class="search-result-card" onclick="window.location.href='watch.html?id=${v.id}'">
            <img class="search-result-thumb" src="${v.thumbnail}" alt="">
            <div>
              <div class="search-result-title">${v.title}</div>
              <div class="search-result-cat">${v.category || ""}</div>
            </div>
          </div>
        `;
      });
    });

    loadHero();
    loadRows();
  </script>

</body>
</html>
