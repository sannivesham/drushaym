<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — సన్నివేశం స్ట్రీమ్</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--card:#111118;--gold:#f5a623;--gold2:#e8942a;--text:#fff;--text2:#b3b3b3;--border:rgba(255,255,255,0.08);}
    body{
      background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .login-box{
      width:100%;max-width:380px;padding:40px 32px;
      background:var(--card);border:1px solid var(--border);border-radius:20px;
      text-align:center;
    }
    .login-logo{
      font-size:1.5rem;font-weight:800;margin-bottom:8px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .login-sub{color:var(--text2);font-size:0.85rem;margin-bottom:28px;}
    input{
      width:100%;padding:14px 16px;margin-bottom:14px;
      border-radius:10px;border:1px solid var(--border);
      background:rgba(255,255,255,0.05);color:var(--text);
      font-size:0.95rem;font-family:'Inter',sans-serif;outline:none;
    }
    input:focus{border-color:var(--gold);}
    button{
      width:100%;padding:14px;margin-top:6px;
      border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;font-weight:700;font-size:0.95rem;cursor:pointer;
      font-family:'Inter',sans-serif;
    }
    #loginMsg{margin-top:14px;color:#ff6b6b;font-size:0.85rem;min-height:18px;}
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">సన్నివేశం స్ట్రీమ్</div>
    <div class="login-sub">Admin Dashboard Login</div>

    <input type="email" id="adminEmail" placeholder="Email">
    <input type="password" id="adminPassword" placeholder="Password">
    <button id="adminLoginBtn">లాగిన్ చేయండి</button>

    <p id="loginMsg"></p>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "dashboard.html";
    });

    document.getElementById("adminLoginBtn").addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();
      const msg = document.getElementById("loginMsg");

      if (!email || !password) {
        msg.innerText = "Email మరియు Password నమోదు చేయండి";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (e) {
        msg.innerText = "లాగిన్ విఫలమైంది — వివరాలు తనిఖీ చేయండి";
      }
    });
  </script>

</body>
</html>
