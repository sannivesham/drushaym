<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — సన్నివేశం స్ట్రీమ్</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--card:#111118;--card2:#16161f;--gold:#f5a623;--gold2:#e8942a;
      --text:#fff;--text2:#b3b3b3;--text3:#808080;--border:rgba(255,255,255,0.08);
      --green:#2ed573;--red:#e74c3c;
    }
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--bg);z-index:100;
    }
    .topbar-logo{
      font-size:1.2rem;font-weight:800;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    #logoutBtn{
      padding:9px 18px;border-radius:8px;border:1px solid var(--border);
      background:transparent;color:var(--text2);font-size:0.82rem;cursor:pointer;
      font-family:'Inter',sans-serif;
    }
    #logoutBtn:hover{color:var(--text);border-color:rgba(255,255,255,0.25);}

    .dash-wrap{max-width:1100px;margin:0 auto;padding:28px 24px 80px;}

    .dash-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;}
    .dash-btn{
      padding:10px 20px;border-radius:24px;border:1px solid var(--border);
      background:var(--card);color:var(--text2);font-size:0.85rem;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;transition:0.2s;
    }
    .dash-btn:hover{color:var(--text);}
    .dash-btn.active{background:var(--gold);color:#000;border-color:var(--gold);}

    .dash-section{display:none;}
    .dash-section.active-section{display:block;}

    .panel{
      background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:26px 24px;margin-bottom:28px;
    }
    .panel h2{font-size:1.05rem;font-weight:700;margin-bottom:18px;}

    input,textarea,select{
      width:100%;padding:12px 14px;margin-bottom:12px;
      border-radius:10px;border:1px solid var(--border);
      background:rgba(255,255,255,0.05);color:var(--text);
      font-size:0.9rem;font-family:'Inter',sans-serif;outline:none;
    }
    input:focus,textarea:focus,select:focus{border-color:var(--gold);}
    textarea{min-height:80px;resize:vertical;}
    select option{background:#1a1a24;}

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:600px){.row2{grid-template-columns:1fr;}}

    .btn-primary{
      padding:12px 24px;border:none;border-radius:10px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#000;font-weight:700;font-size:0.88rem;cursor:pointer;
      font-family:'Inter',sans-serif;
    }
    .btn-danger{
      padding:8px 14px;border:none;border-radius:8px;
      background:rgba(231,76,60,0.15);color:var(--red);
      font-size:0.78rem;font-weight:700;cursor:pointer;
      border:1px solid rgba(231,76,60,0.3);
      font-family:'Inter',sans-serif;
    }
    .btn-outline{
      padding:8px 14px;border-radius:8px;
      background:transparent;color:var(--gold);font-size:0.78rem;font-weight:700;
      cursor:pointer;border:1px solid rgba(245,166,35,0.35);
      font-family:'Inter',sans-serif;
    }

    .msg{font-size:0.8rem;color:var(--gold);margin-top:6px;min-height:16px;}

    .item-row{
      display:flex;align-items:center;gap:14px;
      padding:14px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,0.02);margin-bottom:10px;
      flex-wrap:wrap;
    }
    .item-thumb{width:90px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#000;}
    .item-info{flex:1;min-width:150px;}
    .item-title{font-size:0.9rem;font-weight:600;}
    .item-sub{font-size:0.78rem;color:var(--text3);margin-top:2px;}
    .item-actions{display:flex;gap:8px;flex-wrap:wrap;}

    .badge{
      padding:3px 9px;border-radius:20px;font-size:0.68rem;font-weight:700;
      display:inline-block;
    }
    .badge-free{background:rgba(46,213,115,0.15);color:var(--green);}
    .badge-paid{background:rgba(245,166,35,0.15);color:var(--gold);}
    .badge-active{background:rgba(46,213,115,0.15);color:var(--green);}
    .badge-expired{background:rgba(231,76,60,0.15);color:var(--red);}

    .sub-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
    .sub-table th{
      text-align:left;color:var(--text3);font-weight:600;font-size:0.75rem;
      text-transform:uppercase;letter-spacing:0.5px;padding:10px 8px;
      border-bottom:1px solid var(--border);
    }
    .sub-table td{padding:12px 8px;border-bottom:1px solid var(--border);}
    .sub-table-wrap{overflow-x:auto;}
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">సన్నివేశం స్ట్రీమ్ — Admin</div>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="dash-wrap">

    <div class="dash-nav">
      <button class="dash-btn active" data-section="categoriesSection">Categories</button>
      <button class="dash-btn" data-section="videosSection">Videos</button>
      <button class="dash-btn" data-section="heroSection">Featured / Hero</button>
      <button class="dash-btn" data-section="subscribersSection">Subscribers</button>
    </div>

    <!-- CATEGORIES -->
    <div id="categoriesSection" class="dash-section active-section">
      <div class="panel">
        <h2>కొత్త Category జోడించండి</h2>
        <div class="row2">
          <input type="text" id="catName" placeholder="Category Name (e.g. భక్తి కథలు)">
          <input type="text" id="catEmoji" placeholder="Emoji (optional, e.g. 🙏)">
        </div>
        <input type="number" id="catOrder" placeholder="Order (lower shows first)">
        <button class="btn-primary" id="saveCatBtn">Save Category</button>
        <p class="msg" id="catMsg"></p>
      </div>

      <div class="panel">
        <h2>అన్ని Categories</h2>
        <div id="catList"></div>
      </div>
    </div>

    <!-- VIDEOS -->
    <div id="videosSection" class="dash-section">
      <div class="panel">
        <h2>కొత్త వీడియో జోడించండి</h2>
        <input type="text" id="vidTitle" placeholder="Video Title">
        <textarea id="vidDesc" placeholder="Description"></textarea>
        <div class="row2">
          <input type="text" id="vidYoutubeId" placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)">
          <input type="text" id="vidThumb" placeholder="Thumbnail URL (leave blank = auto from YouTube)">
        </div>
        <div class="row2">
          <select id="vidCategorySelect">
            <option value="">Select Category</option>
          </select>
          <select id="vidAccess">
            <option value="free">Free</option>
            <option value="paid">Premium (Paid)</option>
          </select>
        </div>
        <div class="row2">
          <input type="text" id="vidDuration" placeholder="Duration (e.g. 12:45)">
          <input type="text" id="vidYear" placeholder="Year (e.g. 2026)">
        </div>
        <button class="btn-primary" id="saveVidBtn">Save Video</button>
        <p class="msg" id="vidMsg"></p>
      </div>

      <div class="panel">
        <h2>అన్ని వీడియోలు</h2>
        <div id="vidList"></div>
      </div>
    </div>

    <!-- HERO -->
    <div id="heroSection" class="dash-section">
      <div class="panel">
        <h2>Featured / Hero Video</h2>
        <p style="color:var(--text2);font-size:0.85rem;margin-bottom:16px;">
          Home page పైన పెద్దగా చూపించే వీడియో ఇది.
        </p>
        <select id="heroVideoSelect">
          <option value="">Select Video</option>
        </select>
        <button class="btn-primary" id="saveHeroBtn">Save as Featured</button>
        <p class="msg" id="heroMsg"></p>
      </div>
    </div>

    <!-- SUBSCRIBERS -->
    <div id="subscribersSection" class="dash-section">
      <div class="panel">
        <h2>Subscribers</h2>
        <button class="btn-outline" id="cleanupExpiredBtn" style="margin-bottom:16px;">
          గడువు ముగిసిన వారిని Deactivate చేయండి
        </button>
        <div class="sub-table-wrap">
          <table class="sub-table">
            <thead>
              <tr>
                <th>Name</th><th>Email</th><th>Plan</th><th>Amount</th>
                <th>Status</th><th>Expires</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="subsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="dashboard.js"></script>

</body>
</html>
