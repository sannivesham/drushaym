<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — సన్నివేశం</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--card:#111118;--gold:#f5a623;
      --text:#fff;--text2:#b3b3b3;--text3:#555;
    }
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}

    @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .fade-in{animation:fadeInUp 0.5s ease both;}

    .skeleton{position:relative;overflow:hidden;background:#1a1a24;}
    .skeleton::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
      transform:translateX(-100%);animation:shimmer 1.4s infinite;
    }
    @keyframes shimmer{100%{transform:translateX(100%);}}

    /* NAV */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 28px;background:var(--card);border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .topbar-logo{font-size:1.2rem;font-weight:800;color:var(--gold);cursor:pointer;}
    .topbar-back{
      display:flex;align-items:center;gap:8px;color:var(--text2);
      font-size:0.88rem;cursor:pointer;background:none;border:none;
      transition:color 0.2s;
    }
    .topbar-back:hover{color:var(--text);}

    /* PLAYER WRAP */
    .player-wrap{
      position:relative;width:100%;
      background:#000;overflow:hidden;
    }

    #ytIframe{
      position:absolute;
      top:-9999px;left:-9999px;
      width:1px;height:1px;
      pointer-events:none;
      opacity:0;
    }

    .player-stage{
      position:relative;width:100%;
      aspect-ratio:16/9;background:#000;
      cursor:pointer;
      user-select:none;
    }

    .player-thumb{
      position:absolute;inset:0;
      object-fit:cover;width:100%;height:100%;
      transition:opacity 0.4s;
      z-index:2;
    }
    .player-thumb.hide{opacity:0;pointer-events:none;}

    /* Video-loading spinner (while cueing) */
    .video-spinner{
      position:absolute;inset:0;z-index:6;
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0.35);
      opacity:0;pointer-events:none;transition:opacity 0.25s;
    }
    .video-spinner.show{opacity:1;pointer-events:all;}
    .spinner-ring{
      width:48px;height:48px;border-radius:50%;
      border:3px solid rgba(245,166,35,0.25);
      border-top-color:var(--gold);
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    .big-play{
      position:absolute;inset:0;z-index:3;
      display:flex;align-items:center;justify-content:center;
    }
    .big-play-btn{
      width:72px;height:72px;border-radius:50%;
      background:rgba(245,166,35,0.9);
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;color:#000;
      transition:transform 0.2s;cursor:pointer;
      border:none;
      animation:playPulse 2s ease-in-out infinite;
    }
    @keyframes playPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0.4);}
      50%{box-shadow:0 0 0 14px rgba(245,166,35,0);}
    }
    .big-play-btn:hover{transform:scale(1.08);}
    .big-play.hide{display:none;}

    .lock-screen{
      position:absolute;inset:0;z-index:10;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      background:rgba(10,10,15,0.92);backdrop-filter:blur(8px);gap:16px;
    }
    .lock-screen.show{display:flex;animation:fadeInUp 0.4s ease both;}
    .lock-icon{font-size:3rem;}
    .lock-title{font-size:1.3rem;font-weight:700;}
    .lock-sub{color:var(--text2);font-size:0.9rem;text-align:center;max-width:300px;line-height:1.6;}
    .lock-btn{
      padding:12px 32px;border-radius:8px;
      background:linear-gradient(135deg,var(--gold),#e8942a);
      color:#000;font-weight:700;font-size:0.95rem;
      border:none;cursor:pointer;margin-top:8px;
      transition:transform 0.2s;
    }
    .lock-btn:hover{transform:translateY(-2px);}

    .controls{
      position:absolute;bottom:0;left:0;right:0;z-index:5;
      background:linear-gradient(transparent,rgba(0,0,0,0.85));
      padding:16px 20px 14px;
      opacity:0;transition:opacity 0.25s;
    }
    .player-stage:hover .controls{opacity:1;}
    .controls.always-show{opacity:1;}

    .progress-wrap{
      width:100%;height:4px;background:rgba(255,255,255,0.2);
      border-radius:2px;cursor:pointer;margin-bottom:12px;
      position:relative;
    }
    .progress-wrap:hover{height:6px;}
    .progress-bar{
      height:100%;background:var(--gold);border-radius:2px;
      position:relative;transition:width 0.1s linear;
    }
    .progress-dot{
      position:absolute;right:-6px;top:50%;
      transform:translateY(-50%);
      width:12px;height:12px;border-radius:50%;
      background:var(--gold);
    }
    .progress-buffered{
      position:absolute;top:0;left:0;height:100%;
      background:rgba(255,255,255,0.25);border-radius:2px;
    }

    .controls-row{
      display:flex;align-items:center;gap:12px;
    }
    .ctrl-btn{
      background:none;border:none;color:var(--text);
      font-size:1.1rem;cursor:pointer;padding:4px 6px;
      opacity:0.85;transition:opacity 0.15s, transform 0.15s;
      display:flex;align-items:center;justify-content:center;
    }
    .ctrl-btn:hover{opacity:1;transform:scale(1.1);}
    .time-display{font-size:0.8rem;color:var(--text2);white-space:nowrap;}
    .spacer{flex:1;}
    .volume-wrap{display:flex;align-items:center;gap:6px;}
    .volume-slider{
      -webkit-appearance:none;appearance:none;
      width:70px;height:3px;border-radius:2px;
      background:rgba(255,255,255,0.25);cursor:pointer;outline:none;
    }
    .volume-slider::-webkit-slider-thumb{
      -webkit-appearance:none;width:12px;height:12px;
      border-radius:50%;background:var(--text);cursor:pointer;
    }
    .quality-btn{
      font-size:0.72rem;font-weight:700;padding:3px 8px;
      border-radius:4px;border:1px solid rgba(255,255,255,0.3);
      color:var(--text2);background:none;cursor:pointer;
    }
    .quality-btn:hover{border-color:var(--text);color:var(--text);}

    .skip-flash{
      position:absolute;top:50%;transform:translateY(-50%);
      z-index:6;font-size:0.9rem;font-weight:700;
      background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:30px;
      opacity:0;transition:opacity 0.3s;pointer-events:none;
      color:var(--text);
    }
    .skip-flash.left{left:20%;}
    .skip-flash.right{right:20%;}
    .skip-flash.show{opacity:1;}

    .tap-left,.tap-right{
      position:absolute;top:0;bottom:0;width:35%;z-index:4;cursor:pointer;
    }
    .tap-left{left:0;}
    .tap-right{right:0;}

    /* VIDEO INFO */
    .video-info{
      max-width:900px;margin:32px auto;
      padding:0 24px;
    }
    .video-title-row{
      display:flex;align-items:flex-start;justify-content:space-between;
      gap:16px;flex-wrap:wrap;margin-bottom:16px;
    }
    .video-main-title{font-size:1.5rem;font-weight:700;line-height:1.3;}
    .video-meta-row{
      display:flex;gap:16px;align-items:center;
      margin-bottom:20px;flex-wrap:wrap;
    }
    .video-meta-item{font-size:0.82rem;color:var(--text2);}
    .video-desc{
      font-size:0.9rem;color:var(--text2);line-height:1.7;
      margin-bottom:32px;max-width:600px;
    }
    .related-title{font-size:1rem;font-weight:700;margin-bottom:16px;}
    .related-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:14px;
    }
    .related-card{cursor:pointer;border-radius:8px;overflow:hidden;background:#111;transition:transform 0.2s, opacity 0.2s;}
    .related-card:hover{opacity:0.85;transform:translateY(-3px);}
    .related-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;}
    .related-body{padding:10px;}
    .related-card-title{font-size:0.82rem;font-weight:600;}

    .related-skel{border-radius:8px;overflow:hidden;background:#111;}
    .related-skel .skeleton{width:100%;aspect-ratio:16/9;}
    .related-skel-line{height:10px;border-radius:4px;margin:10px;}

    @media(max-width:600px){
      .topbar{padding:12px 16px;}
      .video-info{padding:0 16px;margin:20px auto;}
      .video-main-title{font-size:1.2rem;}
      .volume-wrap{display:none;}
      .quality-btn{display:none;}
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="topbar-back" onclick="window.history.back()">← వెనుకకు</button>
    <div class="topbar-logo" onclick="window.location.href='index.html'">సన్నివేశం ▶</div>
    <div style="width:80px;"></div>
  </div>

  <!-- HIDDEN YOUTUBE IFRAME -->
  <iframe
    id="ytIframe"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <!-- PLAYER STAGE -->
  <div class="player-wrap">
    <div class="player-stage" id="playerStage">

      <img class="player-thumb" id="playerThumb" src="" alt="">

      <div class="video-spinner" id="videoSpinner">
        <div class="spinner-ring"></div>
      </div>

      <div class="big-play" id="bigPlay">
        <button class="big-play-btn" id="bigPlayBtn">▶</button>
      </div>

      <!-- Lock screen -->
      <div class="lock-screen" id="lockScreen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Premium Content</div>
        <div class="lock-sub">ఈ వీడియో చూడడానికి Subscription అవసరం</div>
        <button class="lock-btn" onclick="window.location.href='subscribe.html'">Subscribe చేయండి</button>
      </div>

      <!-- Skip flash indicators -->
      <div class="skip-flash left" id="skipLeft">⏪ 10s</div>
      <div class="skip-flash right" id="skipRight">10s ⏩</div>

      <!-- Double tap zones -->
      <div class="tap-left" id="tapLeft"></div>
      <div class="tap-right" id="tapRight"></div>

      <!-- Controls -->
      <div class="controls" id="controls">
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-buffered" id="progressBuffered" style="width:0%"></div>
          <div class="progress-bar" id="progressBar" style="width:0%">
            <div class="progress-dot"></div>
          </div>
        </div>
        <div class="controls-row">
          <button class="ctrl-btn" id="playPauseBtn">▶</button>
          <button class="ctrl-btn" id="skipBackBtn">⏪</button>
          <button class="ctrl-btn" id="skipFwdBtn">⏩</button>
          <div class="volume-wrap">
            <button class="ctrl-btn" id="muteBtn">🔊</button>
            <input class="volume-slider" type="range" id="volumeSlider" min="0" max="100" value="80">
          </div>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          <div class="spacer"></div>
          <button class="quality-btn" id="qualityBtn">HD</button>
          <button class="ctrl-btn" id="fullscreenBtn">⛶</button>
        </div>
      </div>

    </div>
  </div>

  <!-- VIDEO INFO -->
  <div class="video-info">
    <div class="video-title-row">
      <h1 class="video-main-title" id="videoTitle">లోడ్ అవుతోంది...</h1>
    </div>
    <div class="video-meta-row">
      <span class="video-meta-item" id="videoYear"></span>
      <span class="video-meta-item" id="videoCat"></span>
      <span class="video-meta-item" id="videoDur"></span>
      <span id="videoAccessBadge"></span>
    </div>
    <p class="video-desc" id="videoDesc"></p>
    <div class="related-title">మరిన్ని వీడియోలు</div>
    <div class="related-grid" id="relatedGrid">
      <div class="related-skel"><div class="skeleton"></div><div class="related-skel-line skeleton"></div></div>
      <div class="related-skel"><div class="skeleton"></div><div class="related-skel-line skeleton"></div></div>
      <div class="related-skel"><div class="skeleton"></div><div class="related-skel-line skeleton"></div></div>
    </div>
  </div>

  <script>
    // YouTube IFrame API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    var player;
    var playerReady = false;
    var isPlaying = false;
    var progressInterval = null;
    var controlsTimeout = null;

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('ytIframe', {
        height: '100%', width: '100%',
        playerVars: {
          controls: 0, disablekb: 1, rel: 0, modestbranding: 1,
          iv_load_policy: 3, showinfo: 0, fs: 0, cc_load_policy: 0,
          playsinline: 1, autoplay: 0
        },
        events: {
          onReady: function(e) {
            playerReady = true;
            window.player = player;
            window.playerReady = true;
            e.target.setVolume(80);
            const iframe = document.getElementById('ytIframe');
            iframe.style.position = 'absolute';
            iframe.style.top = '0'; iframe.style.left = '0';
            iframe.style.width = '100%'; iframe.style.height = '100%';
            iframe.style.opacity = '1'; iframe.style.pointerEvents = 'none';
            iframe.style.zIndex = '1';
            document.getElementById('playerStage').appendChild(iframe);
          },
          onStateChange: function(e) {
            const spinner = document.getElementById('videoSpinner');
            if (e.data === YT.PlayerState.BUFFERING) {
              spinner.classList.add('show');
            } else {
              spinner.classList.remove('show');
            }
            if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              document.getElementById('playPauseBtn').innerText = '⏸';
              document.getElementById('bigPlay').classList.add('hide');
              document.getElementById('playerThumb').classList.add('hide');
              startProgress();
            } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
              isPlaying = false;
              document.getElementById('playPauseBtn').innerText = '▶';
              if (e.data === YT.PlayerState.ENDED) {
                document.getElementById('bigPlay').classList.remove('hide');
              }
              clearInterval(progressInterval);
            }
          },
          onError: function() {
            document.getElementById('videoSpinner').classList.remove('show');
            document.getElementById('videoTitle').innerText = "వీడియో లోడ్ చేయడంలో సమస్య";
          }
        }
      });
    };

    function startProgress() {
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (!player || !playerReady) return;
        const dur = player.getDuration() || 0;
        const cur = player.getCurrentTime() || 0;
        if (dur > 0) {
          document.getElementById('progressBar').style.width = `${(cur / dur) * 100}%`;
          document.getElementById('progressBuffered').style.width =
            `${(player.getVideoLoadedFraction() || 0) * 100}%`;
          document.getElementById('timeDisplay').innerText =
            `${formatTime(cur)} / ${formatTime(dur)}`;
        }
      }, 500);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    document.getElementById('bigPlayBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (player && playerReady) {
        document.getElementById('videoSpinner').classList.add('show');
        player.playVideo();
      }
    });

    document.getElementById('playPauseBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!player || !playerReady) return;
      isPlaying ? player.pauseVideo() : player.playVideo();
    });

    document.getElementById('skipBackBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      skip(-10);
    });
    document.getElementById('skipFwdBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      skip(10);
    });

    function skip(secs) {
      if (!player || !playerReady) return;
      player.seekTo(Math.max(0, player.getCurrentTime() + secs), true);
      flashSkip(secs > 0 ? 'right' : 'left', secs);
    }

    function flashSkip(side, secs) {
      const el = document.getElementById(`skip${side.charAt(0).toUpperCase() + side.slice(1)}`);
      el.innerText = secs > 0 ? `${secs}s ⏩` : `⏪ ${Math.abs(secs)}s`;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 800);
    }

    document.getElementById('tapLeft').addEventListener('click', () => skip(-10));
    document.getElementById('tapRight').addEventListener('click', () => skip(10));

    document.getElementById('progressWrap').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!player || !playerReady) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      player.seekTo(pct * player.getDuration(), true);
    });

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      e.stopPropagation();
      if (player && playerReady) player.setVolume(e.target.value);
    });

    document.getElementById('muteBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!player || !playerReady) return;
      if (player.isMuted()) {
        player.unMute();
        document.getElementById('muteBtn').innerText = '🔊';
      } else {
        player.mute();
        document.getElementById('muteBtn').innerText = '🔇';
      }
    });

    document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = document.getElementById('playerStage');
      if (!document.fullscreenElement) {
        wrap.requestFullscreen().catch(() => {});
        document.getElementById('fullscreenBtn').innerText = '⊡';
      } else {
        document.exitFullscreen();
        document.getElementById('fullscreenBtn').innerText = '⛶';
      }
    });

    const stage = document.getElementById('playerStage');
    stage.addEventListener('mousemove', () => {
      document.getElementById('controls').classList.add('always-show');
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(() => {
        if (isPlaying) document.getElementById('controls').classList.remove('always-show');
      }, 2500);
    });
  </script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      doc, getDoc, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    let isSubscribed = false;

    function isActiveSubscription(data) {
      if (!data || !data.active) return false;
      if (!data.expiresAt) return true;
      return new Date(data.expiresAt).getTime() > Date.now();
    }

    function extractYoutubeId(input) {
      if (!input) return "";
      input = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      try {
        const url = new URL(input);
        const v2 = url.searchParams.get("v");
        if (v2) return v2;
      } catch (e) {}
      return input;
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const snap = await getDoc(doc(db, "subscribers", user.uid));
          isSubscribed = isActiveSubscription(snap.exists() ? snap.data() : null);
        } catch(e) {}
      }
      loadVideo();
    });

    async function loadVideo() {
      if (!videoId) return;
      try {
        const snap = await getDoc(doc(db, "streamVideos", videoId));
        if (!snap.exists()) return;
        const v = snap.data();

        document.title = `${v.title} — సన్నివేశం`;
        const thumbEl = document.getElementById("playerThumb");
        thumbEl.classList.add("skeleton");
        thumbEl.onload = () => thumbEl.classList.remove("skeleton");
        thumbEl.src = v.thumbnail || "";

        document.getElementById("videoTitle").innerText = v.title || "";
        document.getElementById("videoTitle").classList.add("fade-in");
        document.getElementById("videoDesc").innerText = v.description || "";
        document.getElementById("videoYear").innerText = v.year || "";
        document.getElementById("videoCat").innerText = v.category || "";
        document.getElementById("videoDur").innerText = v.duration || "";
        document.getElementById("videoAccessBadge").innerHTML = v.access === "free"
          ? `<span style="padding:3px 10px;border-radius:4px;background:rgba(46,213,115,0.15);color:#2ed573;font-size:0.75rem;font-weight:700;border:1px solid rgba(46,213,115,0.3);">FREE</span>`
          : `<span style="padding:3px 10px;border-radius:4px;background:rgba(245,166,35,0.15);color:#f5a623;font-size:0.75rem;font-weight:700;border:1px solid rgba(245,166,35,0.3);">⭐ PREMIUM</span>`;

        const canWatch = v.access === "free" || isSubscribed;

        if (!canWatch) {
          document.getElementById("lockScreen").classList.add("show");
          document.getElementById("bigPlay").classList.add("hide");
        } else {
          document.getElementById("videoSpinner").classList.add("show");
          const cleanId = extractYoutubeId(v.youtubeId || "");
          const checkReady = setInterval(() => {
            if (window.player && window.playerReady) {
              clearInterval(checkReady);
              window.player.cueVideoById(cleanId);
              document.getElementById("videoSpinner").classList.remove("show");
              document.getElementById("bigPlayBtn").onclick = (e) => {
                e.stopPropagation();
                document.getElementById("videoSpinner").classList.add("show");
                window.player.playVideo();
              };
            }
          }, 200);
        }

        const allSnap = await getDocs(collection(db, "streamVideos"));
        const related = [];
        allSnap.forEach(d => {
          if (d.id !== videoId && d.data().categoryId === v.categoryId) {
            related.push({ id: d.id, ...d.data() });
          }
        });

        const grid = document.getElementById("relatedGrid");
        grid.innerHTML = "";
        if (related.length === 0) {
          grid.innerHTML = "<p style='color:var(--text3);grid-column:1/-1;'>సంబంధిత వీడియోలు లేవు</p>";
        }
        related.slice(0, 6).forEach((r, i) => {
          grid.innerHTML += `
            <div class="related-card fade-in" style="animation-delay:${i * 0.05}s" onclick="window.location.href='watch.html?id=${r.id}'">
              <img class="related-thumb" src="${r.thumbnail}" alt="${r.title}" loading="lazy">
              <div class="related-body">
                <div class="related-card-title">${r.title}</div>
              </div>
            </div>
          `;
        });

      } catch(e) { console.log(e); }
    }
  </script>

</body>
</html>
